<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下架函模板 | 小荧智能自助包</title>
    <meta name="description" content="面向主流平台的申诉文书框架。" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: #1f2933;
        background: #f6f7f8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0; }
      .back { display: inline-block; margin-bottom: 20px; color: #5d6670; text-decoration: none; }
      .back:hover { color: #1f2933; }
      article { padding: 40px; border: 1px solid #e1e4e8; border-radius: 18px; background: #fff; box-shadow: 0 8px 28px rgba(25, 33, 42, 0.06); }
      .eyebrow { margin: 0 0 10px; color: #69737d; font-size: 14px; font-weight: 600; }
      h1 { margin: 0 0 24px; font-size: clamp(26px, 5vw, 34px); line-height: 1.25; }
      p { margin: 18px 0; font-size: 16px; line-height: 1.85; }
      blockquote { margin: 24px 0; padding: 14px 18px; border-left: 4px solid #8b96a1; border-radius: 0 10px 10px 0; background: #f4f5f6; color: #525c66; }
      blockquote p { margin: 0; }
      .fields { margin-top: 28px; }
      .notice { color: #69737d; text-align: center; font-size: 12px; }
      @media (max-width: 560px) {
        main { padding: 28px 0; }
        article { padding: 26px 20px; border-radius: 14px; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="back" href="/">← 返回小荧</a>
      <article>
        <p class="eyebrow">智能自助包</p>
        <h1>下架函模板（占位）</h1>
        <blockquote>
          <p>正式使用前须经法务审核；此处仅为结构与措辞示例。</p>
        </blockquote>
        <p><strong>致某平台投诉处理团队：</strong></p>
        <p>本人发现贵平台存在侵犯本人合法权益之内容（请填写链接或描述）。现依据贵平台社区准则及相关法律，请求贵方尽快删除或屏蔽上述内容，并反馈处理结果。</p>
        <div class="fields">
          <p><strong>投诉人（可用化名）：</strong> ________</p>
          <p><strong>联系方式：</strong> ________</p>
          <p><strong>日期：</strong> ________</p>
        </div>
      </article>
      <p class="notice">本页面仅提供一般信息与行动参考，不能替代律师或专业机构的个案意见。</p>
    </main>
  </body>
</html>
